# Optional CI (Q-M5): lint, type checks and tests on every push.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: orchestrator
          POSTGRES_DB: orchestrator
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U orchestrator" --health-interval 5s --health-retries 10
    env:
      POSTGRES_PASSWORD: orchestrator
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest --cov
      - run: python3 ../scripts/adr.py check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
