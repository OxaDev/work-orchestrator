# Installed by `make init` (backend/.venv/bin/pre-commit install).
# Local hooks reuse the project toolchains; no hook downloads its own tool versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: bash -c 'cd backend && .venv/bin/ruff check --fix . && .venv/bin/ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && .venv/bin/mypy app tests'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint + prettier (frontend)
        entry: bash -c 'cd frontend && npx eslint . && npx prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: adr-check
        name: ADR index check
        entry: python3 scripts/adr.py check
        language: system
        files: ^docs/adr/
        pass_filenames: false
