# Production-like stack (ADR-0012). Only the frontend is published, on 127.0.0.1;
# an external nginx terminates HTTPS and forwards BASE_PATH to it (ADR-0011).
name: work-orchestrator

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run make env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      POSTGRES_DB: ${POSTGRES_DB:?run make env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BASE_PATH: ${BASE_PATH-/work-orchestrator}
    restart: unless-stopped
    environment:
      BASE_PATH: ${BASE_PATH-/work-orchestrator}
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    depends_on:
      backend:
        condition: service_healthy

  # Optional periodic backups (ADR-0040): `make backup-service` (profile "backup").
  backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?run make env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?run make env}
      PGDATABASE: ${POSTGRES_DB:?run make env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - uploads:/data/uploads:ro
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
