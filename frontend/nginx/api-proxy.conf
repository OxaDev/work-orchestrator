# Shared by every API location of default.conf.template (each sets its own proxy_pass).
# The server-level security headers already include nosniff (ADR-0036): avoid a duplicate.
proxy_hide_header X-Content-Type-Options;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $wo_forwarded_proto;
proxy_set_header X-Forwarded-Host $wo_forwarded_host;
