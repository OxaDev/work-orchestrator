# Included in every location that sets its own headers (nginx does not inherit add_header).
# CSP (ADR-0028, ADR-0041): scripts only from the app; inline styles are needed by Mantine
# (CSS variables) and Mermaid (SVG <style>); images from the app, data: and blob: (diagram
# exports); no external image, font or request: nothing leaves the machine.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
